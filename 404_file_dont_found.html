<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — error | ТЭПП</title>
    <meta name="description" content="Страница не найдена. Возможно, поезд уже ушёл.">
    <link rel="icon" href="img/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="404.css">
</head>
<body class="page-404">
    <div id="particles-js"></div>
    <div class="animated-bg">
        <div class="gradient-bg"></div>
    </div>

    <main class="error-main">
        <div class="error-card">
            <div class="error-code">4<span class="error-zero">🚂</span>4</div>
            <h1 class="error-title">Страница не найдена</h1>
            <p class="error-text">
                Страница, которую вы ищете, не найдена,
                либо не была создана.
            </p>

            <div class="error-train">
                <div class="train-track"></div>
                <div class="train-body">
                    <img src="img/ep2k_130let_risynok.png" alt="ЭП2К" class="train-img">
                </div>
            </div>

            <div class="error-actions">
                <a href="Главная_страница.html" class="btn btn-primary">← На главную</a>
                <button class="btn btn-secondary" onclick="goRandom()">🎲 Случайная страница</button>
            </div>

            <p class="error-hint">
                Или воспользуйтесь <a href="Главная_страница.html#search">поиском</a> —
                у нас более 60 страниц.
            </p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js" defer></script>
    <script src="404.js" defer></script>
</body>
</html>
