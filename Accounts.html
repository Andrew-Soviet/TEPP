<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — ТЭПП</title>
    <link rel="icon" href="img/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Подключаем скрипт темы, чтобы он сразу применил сохраненную тему -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('tepp_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <style>
        /* Общий фон в стиле сайта */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Прячем лишнее */
        .top-nav, header, footer, #particles-js, .animated-bg { display: none !important; }

        /* Стеклянная карточка, адаптированная под тему */
        .auth-container {
            position: relative;
            width: 400px;
            padding: 50px 40px;
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: 0 10px 30px var(--shadow-color), 0 0 20px var(--shadow-hover);
            border: 1px solid var(--border-color);
            backdrop-filter: var(--backdrop-blur);
            -webkit-backdrop-filter: var(--backdrop-blur);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .auth-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--shadow-hover);
        }

        .auth-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            text-align: center;
        }

        .auth-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .input-group input::placeholder {
            color: var(--text-muted);
        }

        .input-group input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--highlight-bg);
        }

        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 5px;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .auth-options label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .auth-options input[type="checkbox"] {
            margin-right: 8px;
            accent-color: var(--accent-color);
            width: 16px;
            height: 16px;
        }

        .auth-options a {
            color: var(--accent-color);
            text-decoration: none;
            transition: text-shadow 0.3s;
        }

        .auth-options a:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 2px solid var(--accent-color);
            border-radius: 30px;
            color: var(--accent-color);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: var(--accent-color);
            color: #fff;
            box-shadow: 0 0 20px var(--shadow-hover);
        }

        .auth-footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .auth-footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-title">WELCOME</div>
        <div class="auth-subtitle">Вход в личный кабинет ТЭПП</div>

        <div class="auth-form">
            <div class="input-group">
                <input type="text" id="username" placeholder="Логин или e-mail" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Пароль">
            </div>

            <div class="auth-options">
                <label>
                    <input type="checkbox" id="rememberMe"> Запомнить меня
                </label>
                <a href="#" onclick="alert('Восстановление пароля недоступно.')">Забыли пароль?</a>
            </div>

            <button class="btn-login" onclick="doLogin()">Войти</button>
            
            <div class="error-msg" id="errorMsg">Неверный логин или пароль</div>
        </div>

        <div class="auth-footer">
            Нет аккаунта? <a href="#" onclick="alert('Регистрация временно закрыта.')">Регистрация</a>
        </div>
    </div>

    <script>
        function doLogin() {
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;
            const error = document.getElementById('errorMsg');

            if (user !== '' && pass !== '') {
                localStorage.setItem('tepp_current_user', user);
                
                window.location.href = 'index.html'; 
            } else {
                error.style.display = 'block';
            }
        }
    </script>

</body>
</html>
