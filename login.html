<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в аккаунт — ТЭПП</title>
    <link rel="icon" href="img/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 4rem auto;
            padding: 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: 0 10px 30px var(--shadow-color);
            backdrop-filter: blur(10px);
        }
        .auth-input {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
        }
        .auth-btn {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        .auth-error {
            color: #ff4d4d;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="animated-bg"><div class="gradient-bg"></div></div>

    <header>
        <div class="header-container">
            <h1>Вход в систему</h1>
        </div>
    </header>

    <main>
        <div class="auth-container" id="authBox">
            <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--accent-color);">Вход</h2>
            <div class="auth-error" id="authError">Неверный логин или пароль.</div>
            
            <input type="text" id="login" class="auth-input" placeholder="Логин (pfandrom или autobot)" autocomplete="off">
            <input type="password" id="password" class="auth-input" placeholder="Пароль (1234)">
            
            <button class="btn btn-primary auth-btn" onclick="doLogin()">Войти</button>
            
            <p style="text-align: center; font-size: 0.9rem; color: var(--text-secondary); margin-top: 1rem;">
                Тестовые аккаунты:<br>
                <b>pfandrom / 1234</b><br>
                <b>autobot / 1234</b>
            </p>
        </div>
    </main>

    <script src="script.js" defer></script>
    <script>
        // Простейшая "база данных" на клиенте
        const USERS = {
            'pfandrom': { pass: '1234', profile: 'pfandrom.html' },
            'autobot': { pass: '1234', profile: 'autobot.html' }
        };

        // Проверка при загрузке: если уже вошли, сразу перенаправляем
        document.addEventListener('DOMContentLoaded', () => {
            const currentUser = localStorage.getItem('tepp_user');
            if (currentUser && USERS[currentUser]) {
                window.location.href = USERS[currentUser].profile;
            }
        });

        function doLogin() {
            const user = document.getElementById('login').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;
            const error = document.getElementById('authError');

            if (USERS[user] && USERS[user].pass === pass) {
                localStorage.setItem('tepp_user', user);
                window.location.href = USERS[user].profile;
            } else {
                error.style.display = 'block';
            }
        }
    </script>
</body>
</html>
